version: '3.8'

services:
  # 1. MongoDB Database Service
  database:
    image: mongo:6-jammy
    container_name: saasproject-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saasproject-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://database:27017/saasproject
      - JWT_SECRET=supersecret12345
      - CORS_ORIGIN=http://localhost:8080
      - FRONTEND_URL=http://localhost:8080
      - API_URL=http://localhost:5000
    depends_on:
      - database

  # 3. React Frontend Static Server Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: saasproject-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
