services:
  # 1. EXPRESS BACKEND WEB SERVICE
  - type: web
    name: saasproject-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URL
        sync: false # User will supply their MongoDB Atlas URL during Render setup
      - key: JWT_SECRET
        generateValue: true # Generates a random secure JWT key
      - key: ESEWA_PRODUCT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        sync: false

  # 2. REACT FRONTEND STATIC SITE
  - type: web
    name: saasproject-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          name: saasproject-backend
          type: web
          property: host
    routes:
      # React Router SPA routing fallback — prevents 404 on page refresh
      - type: rewrite
        source: /*
        destination: /index.html
